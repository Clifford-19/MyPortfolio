  <nav class="navbar">

      <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle menu">☰</button>
    </div>

  <section>
    <h2>Get in Touch</h2>
    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <br><br>
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <br><br>
      <button type="submit">Send</button>
      <p class="form-note">This opens your email app with the message pre-filled — nothing is sent automatically. Prefer to email directly? Reach me at <a href="mailto:goodluckyhara@gmail.com">goodluckyhara@gmail.com</a>.</p>
    </form>
  </section>
